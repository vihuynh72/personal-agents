[project]
name = "personal-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "anthropic>=2.12.0",
    "google-genai>=3.6.1",
    "stripe>=17.1.0",
    "playwright>=1.65.2",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["agent/tests", "tools/tests"]
pythonpath = ["."]
